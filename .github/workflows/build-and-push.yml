name: Build and push Docker images

# Reads the Flutter version(s) declared in versions.json, builds a linux/amd64
# image for each one, smoke-tests it by building a real Flutter web app inside
# the container, and pushes it to GitHub Container Registry tagged with the
# literal Flutter version plus every alias in versions.json (latest, 3.44, ...).
#
# amd64 only: these images are meant to run as the `container:` of a GitHub
# Actions job, and every GitHub-hosted runner used here is amd64.

on:
  push:
    branches: [master]
    paths:
      - "versions.json"
      - "sdk/**"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch:
    inputs:
      flutter_version:
        description: "Restrict the build to a single Flutter version (optional, must match an entry in versions.json)."
        required: false
        type: string
  # Weekly rebuild to pull fresh base layers and OS patches even when the
  # Flutter version itself has not moved.
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASENAME: flutter-web

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      empty: ${{ steps.matrix.outputs.empty }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build matrix from versions.json
        id: matrix
        env:
          FILTER_VERSION: ${{ inputs.flutter_version }}
        run: |
          # Group entries that share a flutter_version so we build the
          # image once and push it under every alias at the same time.
          matrix=$(jq -c '
            [
              .images
              | group_by(.flutter_version)
              | .[]
              | {
                  flutter_version: .[0].flutter_version,
                  tags: ([.[].tags[]] | unique)
                }
            ]
            | { include: . }
          ' versions.json)

          if [ -n "${FILTER_VERSION:-}" ]; then
            matrix=$(jq -c --arg v "$FILTER_VERSION" '
              { include: [ .include[] | select(.flutter_version == $v) ] }
            ' <<<"$matrix")
          fi

          include_count=$(jq '.include | length' <<<"$matrix")
          echo "Matrix ($include_count entries):"
          jq . <<<"$matrix"

          {
            echo "matrix=$matrix"
            if [ "$include_count" -eq 0 ]; then
              echo "empty=true"
            else
              echo "empty=false"
            fi
          } >>"$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.empty == 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          FLUTTER_VERSION: ${{ matrix.flutter_version }}
          CHANNEL_TAGS: ${{ toJson(matrix.tags) }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # Registry paths must be lowercase; the GitHub owner name is not
          # necessarily lowercase (PauloGrijp -> paulogrijp).
          image="${REGISTRY}/$(tr '[:upper:]' '[:lower:]' <<<"$OWNER")/${IMAGE_BASENAME}"

          # Image tags must not contain '+'. Flutter uses '+' for build
          # metadata in some pre-releases; replace with '-' as the old
          # ci.sh did.
          version_tag="${FLUTTER_VERSION//+/-}"

          tag_lines="${image}:${version_tag}"
          while read -r t; do
            tag_lines+=$'\n'"${image}:${t}"
          done < <(jq -r '.[]' <<<"$CHANNEL_TAGS")

          {
            echo "image=$image"
            echo "primary=${image}:${version_tag}"
            echo "tags<<__EOF__"
            echo "$tag_lines"
            echo "__EOF__"
          } >>"$GITHUB_OUTPUT"

          echo "Will tag image as:"
          echo "$tag_lines"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: sdk
          file: sdk/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            flutter_version=${{ matrix.flutter_version }}
          tags: ${{ steps.tags.outputs.tags }}
          # Per-version cache scope so the cache for one Flutter version
          # is not invalidated when another moves.
          cache-from: type=gha,scope=flutter-web-${{ matrix.flutter_version }}
          cache-to: type=gha,mode=max,scope=flutter-web-${{ matrix.flutter_version }}

      - name: Smoke test the pushed image
        env:
          IMAGE: ${{ steps.tags.outputs.primary }}
        # Pull the image back from the registry (rather than testing a local
        # build artifact) so the test covers what consumers will actually get,
        # then build a real Flutter web app inside it.
        run: |
          docker pull "$IMAGE"
          docker run --rm --workdir /tmp "$IMAGE" bash -euxo pipefail -c '
            flutter --version
            dart --version
            flutter create smoke_test
            cd smoke_test
            flutter pub get
            flutter analyze
            flutter build web --release
            test -f build/web/index.html
            test -f build/web/main.dart.js
          '

      - name: Report to the job summary
        env:
          IMAGE: ${{ steps.tags.outputs.primary }}
          ALL_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          size=$(docker image inspect "$IMAGE" --format '{{.Size}}' | numfmt --to=iec)
          {
            echo "### Flutter ${{ matrix.flutter_version }} (web only)"
            echo
            echo "Uncompressed image size: \`${size}\`"
            echo
            echo "Tags pushed:"
            echo '```'
            echo "$ALL_TAGS"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
