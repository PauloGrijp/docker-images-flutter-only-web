name: Bump Flutter version

# Manual only. The Flutter version this repository publishes is pinned in
# versions.json and never changes on its own; run this workflow to move the pin
# to a different release. It validates the requested version against Flutter's
# official release index, commits versions.json, and dispatches the build.
#
# You can also just edit versions.json by hand and push -- the build workflow
# triggers on that path. This workflow exists so the bump can be done from the
# Actions tab without a checkout.

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: "Flutter version to pin (e.g. 3.44.8), or a channel name (stable / beta)."
        required: true
        default: "stable"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: bump-flutter-version
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update versions.json
        run: bash scripts/set_flutter_version.sh "${{ inputs.flutter_version }}"

      - name: Show diff
        run: git --no-pager diff -- versions.json || true

      - name: Commit and push if changed
        id: commit
        run: |
          if git diff --quiet -- versions.json; then
            echo "versions.json already pins this version; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pinned=$(jq -r '.images[0].flutter_version' versions.json)

          git add versions.json
          git commit -m "chore: pin Flutter ${pinned}"
          git push origin HEAD:${GITHUB_REF#refs/heads/}

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Trigger build workflow
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
        # Pushes made with GITHUB_TOKEN do not trigger downstream workflows,
        # so we explicitly dispatch the build after committing.
        #
        # workflow_dispatch resolves --ref to the branch tip *at dispatch
        # time*, and a freshly pushed commit can take a few seconds to become
        # visible to that resolver. Dispatching immediately therefore races
        # the push: if the old tip is resolved, the build checks out the
        # previous commit and rebuilds the previous Flutter version. Wait until
        # the API reports our pushed commit as the branch tip before
        # dispatching, and fail loudly rather than dispatch a stale build if it
        # never shows up.
        run: |
          for attempt in $(seq 1 30); do
            remote_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${BRANCH}" --jq '.sha')
            echo "Attempt ${attempt}: branch tip=${remote_sha} expected=${EXPECTED_SHA}"
            if [ "$remote_sha" = "$EXPECTED_SHA" ]; then
              echo "Pushed commit is visible to the API; dispatching build."
              gh workflow run build-and-push.yml --ref "$BRANCH"
              exit 0
            fi
            sleep 5
          done

          echo "::error::Pushed commit ${EXPECTED_SHA} never became the tip of ${BRANCH}; refusing to dispatch a stale build."
          exit 1
